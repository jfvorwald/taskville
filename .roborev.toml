agent = 'claude-code'
model = 'opus'
backup_agent = 'codex'
backup_model = 'gpt-6-sol'
review_agent = 'codex'
security_agent = 'codex'
review_reasoning = 'medium'
review_min_severity = 'medium'
fix_min_severity = 'medium'
refine_min_severity = 'medium'
review_context_count = 0
excluded_commit_patterns = ['docs(', 'chore(release)']
exclude_patterns = ['pnpm-lock.yaml', 'docs/STATUS.md', 'docs/tasks/**', 'docs/LESSONS.md', 'docs/retros/**', 'docs/ROADMAP.md']
review_guidelines = '''
Taskville is a local, single-user live 3D city that observes AI coding agents: a TypeScript pnpm workspace with a Node 26 engine (Hono 4, node:sqlite event log, SSE), pure shared packages (protocol, domain, adapters, demo), a CLI, and a React 19 / React Three Fiber web client served by the engine. ARCHITECTURE.md (revision 3) and .specify/memory/constitution.md are authoritative.

How to report:
- Report only a defect you can trace to a specific line and a concrete failing input or state, stated in one sentence. No speculation or hedged suggestions.
- Do not report formatting or lint (Biome enforces it), type errors (tsc catches them), naming, missing comments, or test style preferences.
- Severity: critical/high only for a security or permission bypass, data loss or corruption, a broken invariant below, or a guess presented as a recorded fact. Medium for logic bugs on realistic paths. Low for everything else.

Check in this order:
1. Security. Every route, reads included, rejects a Host header that is not the loopback host and port. Only a paired browser session (X-Taskville-Session) can send commands; CLI, shim, and bridge tokens never authorize a command. No cookies. State-changing routes check Origin. The session opener runs with execFile and an argument array, never a shell, and is configurable only from the config file or CLI. Evidence and agent text are rendered as escaped text, never HTML or Markdown. Secrets are masked before anything is written to the event log or evidence store. Allow stays disabled until every masked part of a permission input has been revealed.
2. Event log integrity. Events are insert-only; no UPDATE or DELETE on events. Each batch commits events, projection, and head in one transaction before any acknowledgment or broadcast. Ingest sequence is gap-free per project. Same source key with the same content is a duplicate; different content is a conflict, never an overwrite. Unknown projects are rejected with unknown_project.
3. Determinism and purity. packages/protocol, domain, and adapters import no Node built-ins and never read the clock or randomness; time comes from events, and elapsed-time heuristics use an injected clock in selectors, never stored state. Same events in the same order give the same stateHash. Quip choice and timing are seeded from agent and event IDs.
4. Permission bridge and commands. Only bridge-held requests are answerable. A city decision is "sent, unconfirmed" once it reaches a still-open hook response and succeeds only when telemetry confirms it; a closed hook before any city answer is a terminal deny, and exactly one unambiguous matching PostToolUse is a terminal allow (decision #116). Open requests expire on engine start. Commands carrying history context are rejected. Late (spooled) events never open a needs-you state.
5. Honest presentation. Unknown source values stay "unknown". Heuristic states are labeled as heuristic. The code feed never invents line numbers or diffs. Targets in docs are not presented as measurements.
'''

[review.subagents.bug]
agent = 'codex'
model = 'gpt-6-sol'

[review.subagents.security]
agent = 'codex'
model = 'gpt-6-sol'
review_type = 'security'

[review.panels.pre_merge]
members = ['bug', 'security']
synthesis_agent = 'codex'
